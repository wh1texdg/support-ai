name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://support:support@localhost:5432/support_test
      TEST_DATABASE_URL: postgresql+asyncpg://support:support@localhost:5432/support_test
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker compose exec -T backend python -m app.scripts.seed
      - run: python -m app.scripts.smoke
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down
