[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ai"
version = "0.1.0"
description = "Grounded ecommerce support with operator handoff"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "pgvector>=0.3.6,<1", "redis>=5.2,<7",
  "pydantic-settings>=2.7,<3", "openai>=1.60,<3",
  "aiogram>=3.17,<4", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1", "fakeredis[lua]>=2.26,<3", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*", "bot*", "worker*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL with pgvector"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
